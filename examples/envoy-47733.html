<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Envoy: keep the B3 single header on Zipkin inject</title>
<style>
  :root {
    --bg: #fff; --elev: #fafafa; --lane: #f3f3f5; --text: #1f2328; --text2: #57606a; --text3: #8c959f;
    --stroke: #d0d7de; --accent: #0969da; --add: #1a7f37; --chg: #bf8700; --rem: #cf222e; --ctx: #afb8c1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --elev: #161b22; --lane: #11161d; --text: #e6edf3; --text2: #9da7b3; --text3: #6e7681;
      --stroke: #30363d; --accent: #4493f8; --add: #3fb950; --chg: #d29922; --rem: #f85149; --ctx: #484f58;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 0; }
  .muted { color: var(--text2); font-size: 12px; }
  .faint { color: var(--text3); font-size: 12px; }
  .prs { display: grid; gap: 12px; margin: 16px 0; }
  .pr { padding: 12px; border: 1px solid var(--stroke); border-radius: 6px; cursor: pointer; }
  .pr.active { border-color: var(--accent); background: var(--lane); }
  .pr .top { display: flex; justify-content: space-between; font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .pill { padding: 2px 10px; border: 1px solid var(--stroke); border-radius: 999px; cursor: pointer; background: transparent; color: var(--text); font-size: 12px; }
  .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .legend { display: flex; gap: 4px; align-items: center; }
  .sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  .main { display: flex; gap: 16px; align-items: flex-start; }
  .stage { flex: 1; min-width: 0; height: 75vh; border: 1px solid var(--stroke); border-radius: 6px; overflow: hidden; position: relative; cursor: grab; }
  .stage.dragging { cursor: grabbing; }
  .zoom { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
  .zoom button { padding: 2px 8px; background: var(--elev); color: var(--text); border: 1px solid var(--stroke); border-radius: 4px; cursor: pointer; }
  .hint { position: absolute; bottom: 8px; left: 10px; z-index: 2; }
  .panel { width: 380px; flex-shrink: 0; }
  .panel code { display: block; padding: 4px 6px; background: var(--lane); border-radius: 4px; font-size: 11px; margin: 4px 0 8px; word-break: break-all; }
  .item { display: flex; gap: 6px; margin: 4px 0; }
  .item .strip { width: 3px; border-radius: 1px; flex-shrink: 0; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .link { color: var(--accent); cursor: pointer; }
  hr { border: 0; border-top: 1px solid var(--stroke); margin: 10px 0; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .stat { padding: 10px; border: 1px solid var(--stroke); border-radius: 6px; }
  .stat b { font-size: 20px; display: block; }
  .note { margin-top: 12px; padding: 10px 12px; border-left: 3px solid var(--chg); background: var(--lane); border-radius: 4px; }
  svg text { user-select: none; }
</style>
</head>
<body>
<h1 id="title"></h1>
<div class="muted" id="subtitle"></div>
<div class="prs" id="prs"></div>
<div class="bar" id="bar"></div>
<div class="main">
  <div class="stage" id="stage">
    <div class="zoom"><button data-z="in">+</button><button data-z="out">−</button><button data-z="reset">reset</button></div>
    <div class="hint faint" id="hint"></div>
    <svg id="svg"></svg>
  </div>
  <div class="panel" id="panel"></div>
</div>
<div class="stats" id="stats"></div>
<div id="notes"></div>

<script>
const DATA = {
 "title": "Envoy: keep the B3 single header on Zipkin inject",
 "subtitle": "envoyproxy/envoy · tracers/zipkin · PR 47733",
 "prs": [
  {
   "n": 47733,
   "title": "zipkin: fixed the tracer to propagate the b3 header when client use it",
   "state": "MERGED",
   "base": "main",
   "files": 11,
   "add": 174,
   "del": 11,
   "url": "https://github.com/envoyproxy/envoy/pull/47733"
  }
 ],
 "lanes": [
  "request",
  "extract",
  "tracer",
  "inject"
 ],
 "nodes": [
  {
   "id": "headers",
   "label": "downstream headers",
   "file": "b3 or x-b3-*",
   "lane": 0,
   "external": true,
   "prs": {},
   "summary": "Client sends either the single b3 header or the multi x-b3-* headers. Before this fix, Envoy always wrote x-b3-* and left a stale b3 in place.",
   "members": []
  },
  {
   "id": "extractor",
   "label": "SpanContextExtractor",
   "file": "source/extensions/tracers/zipkin/span_context_extractor.h",
   "lane": 1,
   "external": false,
   "prs": {
    "47733": "C"
   },
   "summary": "Remembers whether extractSpanContext() read the single b3 header, so injection can use the same format.",
   "members": [
    {
     "name": "b3SingleFormatUsed()",
     "change": "A",
     "pr": 47733
    },
    {
     "name": "b3_single_format_used_",
     "change": "A",
     "pr": 47733
    }
   ]
  },
  {
   "id": "tracer",
   "label": "Zipkin tracer",
   "file": "source/extensions/tracers/zipkin/zipkin_tracer_impl.cc",
   "lane": 2,
   "external": false,
   "prs": {
    "47733": "C"
   },
   "summary": "After extraction, if the runtime guard is on and the downstream used b3, marks the new span to inject the single header.",
   "members": [
    {
     "name": "setUseB3SingleFormat(true)",
     "change": "A",
     "pr": 47733
    }
   ]
  },
  {
   "id": "guard",
   "label": "runtime guard",
   "file": "source/common/runtime/runtime_features.cc",
   "lane": 2,
   "external": false,
   "prs": {
    "47733": "C"
   },
   "summary": "Reloadable feature envoy.reloadable_features.zipkin_preserve_b3_single_header_format. Set it false to restore always injecting x-b3-*.",
   "members": [
    {
     "name": "RUNTIME_GUARD zipkin_preserve_b3_single_header_format",
     "change": "A",
     "pr": 47733
    }
   ]
  },
  {
   "id": "span",
   "label": "Span",
   "file": "source/extensions/tracers/zipkin/zipkin_core_types.h",
   "lane": 3,
   "external": false,
   "prs": {
    "47733": "C"
   },
   "summary": "Injection writes one b3 value (trace-span-sampled-parent) when the flag is set, and still writes x-b3-* otherwise. Child spans copy the flag.",
   "members": [
    {
     "name": "setUseB3SingleFormat()",
     "change": "A",
     "pr": 47733
    },
    {
     "name": "useB3SingleFormat()",
     "change": "A",
     "pr": 47733
    },
    {
     "name": "inject b3 vs x-b3-*",
     "change": "C",
     "pr": 47733
    }
   ]
  }
 ],
 "edges": [
  {
   "from": "extractor",
   "to": "headers",
   "label": "extractSpanContext",
   "pr": 0,
   "change": "C"
  },
  {
   "from": "tracer",
   "to": "extractor",
   "label": "b3SingleFormatUsed",
   "pr": 47733,
   "change": "A"
  },
  {
   "from": "tracer",
   "to": "guard",
   "label": "reloadable feature",
   "pr": 47733,
   "change": "A"
  },
  {
   "from": "tracer",
   "to": "span",
   "label": "setUseB3SingleFormat",
   "pr": 47733,
   "change": "A"
  },
  {
   "from": "span",
   "to": "headers",
   "label": "inject b3",
   "pr": 47733,
   "change": "A"
  }
 ],
 "notes": [
  {
   "tone": "info",
   "title": "Small fix, clear path",
   "text": "11 files, +174/−11. The behavior change is the extractor flag, the tracer wiring it under a runtime guard, and Span injection choosing b3 instead of x-b3-*."
  }
 ]
};

const NW = 210, NH = 46, LANE_W = 400, ROW_GAP = 90, TOP = 50;
const ORDER = Object.fromEntries(DATA.prs.map((p, i) => [p.n, i + 1]));
const ord = (pr) => ORDER[pr] || 0;
const laneRows = {};
const NODES = DATA.nodes.map((n) => {
  const row = laneRows[n.lane] || 0;
  laneRows[n.lane] = row + 1;
  return { ...n, x: 20 + n.lane * LANE_W, y: n.y ?? TOP + row * ROW_GAP };
});
const byId = Object.fromEntries(NODES.map((n) => [n.id, n]));
const W = 20 + DATA.lanes.length * LANE_W;
const H = Math.max(...NODES.map((n) => n.y)) + NH + 40;

const state = { view: "all", selected: NODES[0] && NODES[0].id, hover: null, zoom: 0.85, pan: { x: 0, y: 0 } };
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorFor = (s) => css(s === "A" ? "--add" : s === "C" ? "--chg" : s === "R" ? "--rem" : "--ctx");
const labelFor = (s) => (s === "A" ? "added" : s === "C" ? "changed" : s === "R" ? "removed" : "unchanged");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function introducedIn(n) {
  let best = 0;
  for (const [k, v] of Object.entries(n.prs)) if (v === "A" && (!best || ord(+k) < ord(best))) best = +k;
  return best;
}
function nodeStatus(n, v) {
  if (v === "all") {
    const vals = Object.values(n.prs);
    if (vals.includes("A")) return "A";
    if (vals.length) return vals.every((x) => x === "R") ? "R" : "C";
    return "ctx";
  }
  const intro = introducedIn(n);
  if (intro && ord(intro) > ord(v)) return "hidden";
  return n.prs[String(v)] || "ctx";
}
function edgeStatus(e, v) {
  if (v === "all") return e.change;
  if (ord(e.pr) > ord(v)) return "hidden";
  return e.pr === v ? e.change : "ctx";
}
function clip(cx, cy, tx, ty) {
  const dx = tx - cx, dy = ty - cy;
  if (!dx && !dy) return { x: cx, y: cy };
  const s = Math.min(dx ? NW / 2 / Math.abs(dx) : Infinity, dy ? NH / 2 / Math.abs(dy) : Infinity);
  return { x: cx + dx * s, y: cy + dy * s };
}
const center = (n) => ({ x: n.x + NW / 2, y: n.y + NH / 2 });
function labelAnchor(p1, p2) {
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const hits = (x, y) => NODES.some((n) => x > n.x + 2 && x < n.x + NW - 2 && y > n.y && y < n.y + NH);
  let p = null;
  for (const t of [0.5, 0.38, 0.62, 0.24, 0.76]) {
    const x = p1.x + dx * t, y = p1.y + dy * t;
    if (!hits(x, y)) { p = { x, y }; break; }
  }
  if (!p) p = { x: p1.x + dx * 0.5, y: Math.min(p1.y, p2.y) - 16 };
  if (Math.abs(dx) >= Math.abs(dy)) return { x: p.x, y: p.y - 12 };
  return { x: p.x + 16, y: p.y };
}

function renderHeader() {
  document.title = DATA.title;
  document.getElementById("title").textContent = DATA.title;
  document.getElementById("subtitle").textContent = DATA.subtitle;
  const prs = document.getElementById("prs");
  prs.style.gridTemplateColumns = `repeat(${Math.min(DATA.prs.length, 4)}, 1fr)`;
  prs.innerHTML = DATA.prs.map((p) => `
    <div class="pr ${state.view === p.n ? "active" : ""}" data-pr="${p.n}">
      <div class="top"><span>${p.url ? `<a href="${esc(p.url)}" target="_blank" onclick="event.stopPropagation()">#${p.n}</a>` : "#" + p.n}</span><span class="muted">${esc(p.state)}</span></div>
      <div>${esc(p.title)}</div>
      <div class="faint">${p.files} files · +${p.add} −${p.del} · base ${esc(p.base)}</div>
    </div>`).join("");
  prs.querySelectorAll(".pr").forEach((el) => (el.onclick = () => setView(state.view === +el.dataset.pr ? "all" : +el.dataset.pr)));

  const views = ["all", ...DATA.prs.map((p) => p.n)];
  document.getElementById("bar").innerHTML =
    `<span class="muted">View:</span>` +
    views.map((v) => `<button class="pill ${state.view === v ? "active" : ""}" data-v="${v}">${v === "all" ? "All PRs (net)" : "Delta in #" + v}</button>`).join("") +
    `<span style="flex:1"></span>` +
    ["A", "C", "R", "ctx"].map((s) => `<span class="legend"><span class="sw" style="background:${colorFor(s)}"></span><span class="muted">${labelFor(s)}</span></span>`).join("");
  document.querySelectorAll("#bar .pill").forEach((el) => (el.onclick = () => setView(el.dataset.v === "all" ? "all" : +el.dataset.v)));
}

function renderSvg() {
  const svg = document.getElementById("svg");
  svg.setAttribute("width", W * state.zoom);
  svg.setAttribute("height", H * state.zoom);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px)`;
  document.getElementById("hint").textContent = `scroll = zoom · drag = pan · click a block for details · ${Math.round(state.zoom * 100)}%`;
  const focus = state.hover || state.selected;
  const v = state.view;
  let out = "<defs>" + ["A", "C", "R", "ctx"].map((s) =>
    `<marker id="arr-${s}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${colorFor(s)}"/></marker>`).join("") + "</defs>";
  DATA.lanes.forEach((title, i) => {
    out += `<rect x="${20 + i * LANE_W - 10}" y="8" width="${NW + 20}" height="${H - 16}" rx="6" fill="${css("--lane")}"/>`;
    out += `<text x="${20 + i * LANE_W}" y="26" fill="${css("--text3")}" font-size="11">${esc(title)}</text>`;
  });
  const labels = [];
  DATA.edges.forEach((e, i) => {
    const s = edgeStatus(e, v), a = byId[e.from], b = byId[e.to];
    if (!a || !b || s === "hidden" || nodeStatus(a, v) === "hidden" || nodeStatus(b, v) === "hidden") return;
    const ca = center(a), cb = center(b);
    const off = DATA.edges.findIndex((o) => o.from === e.from && o.to === e.to) !== i ? 6 : 0;
    const p1 = clip(ca.x, ca.y + off, cb.x, cb.y + off), p2 = clip(cb.x, cb.y + off, ca.x, ca.y + off);
    const lit = focus === e.from || focus === e.to;
    const dash = s === "C" ? 'stroke-dasharray="5 3"' : s === "R" ? 'stroke-dasharray="2 3"' : "";
    out += `<g opacity="${lit ? 1 : s === "ctx" ? 0.25 : 0.6}"><line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${colorFor(s)}" stroke-width="${lit ? 2 : 1.25}" ${dash} marker-end="url(#arr-${s})"/></g>`;
    if (lit) {
      const lp = labelAnchor(p1, p2);
      const text = esc(e.label) + (v === "all" && e.pr ? ` (#${e.pr})` : "");
      labels.push({ ...lp, text });
    }
  });
  NODES.forEach((n) => {
    const s = nodeStatus(n, v);
    if (s === "hidden") return;
    const isSel = state.selected === n.id;
    const tags = Object.entries(n.prs).map(([k, c]) => `#${k}${c}`).join(" ");
    out += `<g class="node" data-id="${esc(n.id)}" style="cursor:pointer" opacity="${s === "ctx" && v !== "all" ? 0.55 : 1}">
      <rect x="${n.x}" y="${n.y}" width="${NW}" height="${NH}" rx="${n.external ? 14 : 4}" fill="${css("--elev")}" stroke="${isSel ? css("--accent") : colorFor(s)}" stroke-width="${isSel ? 2.5 : 1.5}" ${n.external ? 'stroke-dasharray="4 3"' : ""}/>
      <rect x="${n.x}" y="${n.y}" width="4" height="${NH}" fill="${colorFor(s)}"/>
      <text x="${n.x + 12}" y="${n.y + 19}" fill="${css("--text")}" font-size="12" font-weight="600">${esc(n.label)}</text>
      <text x="${n.x + 12}" y="${n.y + 35}" fill="${css("--text3")}" font-size="10">${esc(n.external ? n.file : tags || "context")}</text></g>`;
  });
  labels.forEach((lp) => {
    const w = lp.text.length * 5.4 + 10;
    out += `<rect x="${lp.x - w / 2}" y="${lp.y - 11}" width="${w}" height="14" rx="3" fill="${css("--bg")}" stroke="${css("--stroke")}"/>`;
    out += `<text x="${lp.x}" y="${lp.y}" fill="${css("--text")}" font-size="10" text-anchor="middle">${lp.text}</text>`;
  });
  svg.innerHTML = out;
  svg.querySelectorAll(".node").forEach((g) => {
    g.onmousedown = (e) => e.stopPropagation();
    g.onclick = () => { state.selected = g.dataset.id; render(); };
    g.onmouseenter = () => { if (state.hover !== g.dataset.id) { state.hover = g.dataset.id; renderSvg(); } };
    g.onmouseleave = () => { if (state.hover) { state.hover = null; renderSvg(); } };
  });
}

function renderPanel() {
  const sel = byId[state.selected];
  const panel = document.getElementById("panel");
  if (!sel) { panel.innerHTML = ""; return; }
  const v = state.view;
  const members = sel.members.filter((m) => v === "all" || m.pr === v);
  const edges = DATA.edges.filter((e) => (e.from === sel.id || e.to === sel.id) && (v === "all" || e.pr === v));
  panel.innerHTML = `
    <h3>${esc(sel.label)}</h3><code>${esc(sel.file)}</code>
    <div class="bar">${Object.entries(sel.prs).map(([k, c]) => `<button class="pill" data-v="${k}">#${k} ${labelFor(c)}</button>`).join("")}</div>
    <div>${esc(sel.summary)}</div>
    ${members.length ? `<hr/><b>Members</b>` + members.map((m) => `
      <div class="item"><span class="strip" style="background:${colorFor(m.change)}"></span>
        <div><div class="mono" style="${m.change === "R" ? "text-decoration:line-through" : ""}">${esc(m.name)}</div>
        <div class="faint">${labelFor(m.change)} in #${m.pr}</div></div></div>`).join("") : ""}
    <hr/><b>Links</b>
    ${edges.map((e) => {
      const other = e.from === sel.id ? e.to : e.from;
      return `<div class="item"><span class="strip" style="background:${colorFor(e.change)}"></span>
        <div>${e.from === sel.id ? "→" : "←"} <span class="link" data-id="${esc(other)}">${esc(byId[other] ? byId[other].label : other)}</span>
        <span class="faint"> · ${esc(e.label)} · #${e.pr}</span></div></div>`;
    }).join("")}`;
  panel.querySelectorAll(".pill").forEach((el) => (el.onclick = () => setView(+el.dataset.v)));
  panel.querySelectorAll(".link").forEach((el) => (el.onclick = () => { state.selected = el.dataset.id; render(); }));
}

function renderFooter() {
  const removed = NODES.reduce((a, n) => a + n.members.filter((m) => m.change === "R").length, 0) + DATA.edges.filter((e) => e.change === "R").length;
  const stats = [
    [NODES.filter((n) => introducedIn(n)).length, "new blocks", "--add"],
    [NODES.filter((n) => !introducedIn(n) && Object.keys(n.prs).length).length, "existing blocks changed", "--chg"],
    [DATA.edges.filter((e) => e.change !== "R").length, "links added / changed", "--accent"],
    [removed, "members / links removed", "--rem"],
  ];
  document.getElementById("stats").innerHTML = stats.map(([n, l, c]) => `<div class="stat"><b style="color:${css(c)}">${n}</b><span class="muted">${l}</span></div>`).join("");
  document.getElementById("notes").innerHTML = (DATA.notes || []).map((n) => `<div class="note"><b>${esc(n.title)}</b><div>${esc(n.text)}</div></div>`).join("");
}

function setView(v) { state.view = v; render(); }
function render() { renderHeader(); renderSvg(); renderPanel(); renderFooter(); }

const stage = document.getElementById("stage");
const zoomBy = (f) => { state.zoom = Math.min(2.5, Math.max(0.4, state.zoom * f)); renderSvg(); };
stage.addEventListener("wheel", (e) => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.1 : 0.9); }, { passive: false });
let drag = null;
stage.onmousedown = (e) => { drag = { x: e.clientX, y: e.clientY, px: state.pan.x, py: state.pan.y }; stage.classList.add("dragging"); };
window.onmousemove = (e) => { if (drag) { state.pan = { x: drag.px + e.clientX - drag.x, y: drag.py + e.clientY - drag.y }; renderSvg(); } };
window.onmouseup = () => { drag = null; stage.classList.remove("dragging"); };
document.querySelectorAll(".zoom button").forEach((b) => {
  b.onmousedown = (e) => e.stopPropagation();
  b.onclick = () => b.dataset.z === "in" ? zoomBy(1.2) : b.dataset.z === "out" ? zoomBy(1 / 1.2) : (state.zoom = 0.85, state.pan = { x: 0, y: 0 }, renderSvg());
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
render();
</script>
</body>
</html>
